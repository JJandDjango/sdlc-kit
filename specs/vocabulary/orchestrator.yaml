term: orchestrator

name: Orchestrator

definition: >-
  The operator that runs a unit's tasks: it launches one subagent per
  task, sends a failed task back to its channel, and puts a third failed
  round or a question before the user.

kind: entity

status: ratified
since: 2026-10-25

