  decisions:
  - q: Where do G1's rules run?
    a: 'In a new subcommand, `g1-check`, never inside `validate`: ready-green keeps meaning G0 alone (shape call 1).'
  - q: What are G1's rule codes?
    a: 'A new prefix, `RS`, numbered by condition: six codes, each with one message, and a `to do` carries no code (shape call 2).'
  - q: How does a condition take its status?
    a: '`failed` when one of its rules reports; else `done` when everything it needs is present and current; else `to do`, listing nothing (shape call 3).'
  - q: What gives the G1 verdict its status?
    a: The ratified roll-up of its three conditions, so a feature with no schema and no hard core reads G1 `doing` until its review is signed (shape call 4).
  - q: Where do a lint result, a model-check result and a review live?
    a: In one committed file a feature, `.sdlc/g1/{id}.yaml`, written by `g1-record` alone and bound to its inputs by their hashes (shape call 5).
  - q: How is a tool's result read?
    a: 'By its exit code: 0 passes. `{n}` counts what the linter reports at warning severity or above.'
  - q: How does a person sign a review?
    a: The record carries the signer's name, seat, date and both revisions, with no new form of `Signed:` row. "No agent signs" is a rule of the flow (shape call 6).
  - q: Where do the declarations live?
    a: The component declaration record at `specs/components.yaml`, with a new schema at 1.0.0; the schema patterns and the pins in `.sdlc/config.yaml`. A person writes each, and each is required once G1 is active (shape call 7, ADR 0030).
  - q: What is the venue?
    a: A new flow, `/sdlc g1 {id}`, in its own file; intake's I9 names it where G1 is active for the feature (shape call 8).
  - q: How do the features already done read G1 inactive?
    a: Through the `g1.exempt` list; a feature not on it needs G1. The kit lists the features closed at the release and this feature; `glossary-alias-disjointness`, parked and not started, stays off it (shape call 9).
  - q: What does the refusal cover?
    a: '`progress start` on a task, and `progress done` on a task, a unit or a contract. `block` and `run` stay open (shape call 10).'
  - q: Does CI change?
    a: 'No: no tool runs in the scaffolded workflow, and the refusal is the enforcement (shape call 11).'
  - q: How many units, and which release?
    a: Six, as kit 0.20.0. SC4.3 stands in the release unit, since intake refuses a unit that delivers no check (shape call 12).
  - q: Does a feature before intake show G1?
    a: 'Yes: active and `to do` once G1 is on, as it shows G0 today.'
  - q: Does the `sdlc-spec` agent definition ship?
    a: 'No: a conversation flow that a person signs is no authoring surface for an agent. The venue row for G1 in `docs/operators.md` moves to bound.'
  - q: Does the kit review this feature under G1?
    a: 'No: it passed intake before G1 stood, and the requirements refuse a retroactive review.'
  - q: Do the checks before signing read green?
    a: 'No, and each finding is answered: `component` and `venue` trip CL003, and the dictionary cedes both at intake, as requirements r2 says; `ready check` matches the ratified term `ready-check` (CL014), ratified after r3, and the PO seat maps it in the amendment.'
  - q: What of the three stale facts in requirements r3?
    a: 'The design builds on today''s: 18 features done, 15 ready checks, and the `gates/G0` line as kit 0.17.0 computes it. The PO seat amends the words.'
  - q: Which ratified terms does this design change?
    a: 'Four, each amended at intake: Rule and Condition, for rules that read records; Active gate, for a feature''s exemption; Review, for a pair''s two revisions.'
  - q: Which ADR carries this design?
    a: 'ADR 0038, written at intake: it amends ADR 0031''s "shown and never enforced" for the refusal, and fixes the homes of the records and the declarations, which closes the deferrals of ADR 0007 and of G1''s page.'
  - q: What of the tests that pin this feature's own pair?
    a: Three tests of `tests/test_document_split_g1_pair.py` retire at this design's signature (shape call 13). The fourth, which holds the requirements document's hash, retires with the PO seat's amendment.
