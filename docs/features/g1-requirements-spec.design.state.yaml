schema: spec-interview-state/2
id: g1-requirements-spec
started: 2026-10-07
phase: output
next: W1
requirements_revision: r3
origin: feature
title: "Failure points found before development starts"
seats:
  engineer: user
answers:
  terms:
    - name: Failure point
      definition: anything in a feature's requirements, boundary schemas or hard cores' designs that would fail development.
    - name: Development
      definition: the work on a feature's units; it starts when its first unit's first task is recorded as started.
    - name: Boundary schema
      definition: "a file that fixes the shape of data crossing a service or trust boundary: JSON Schema, OpenAPI or protobuf."
    - name: Hard core
      definition: a component whose defect would be concurrency- or protocol-shaped, invisible until late, and costly to reverse; all three hold (ADR 0007).
    - name: Model
      definition: a formal description of a hard core's design, in TLA+ or P.
    - name: Linter
      definition: "the tool that lints a boundary schema: Spectral or `buf lint`."
    - name: Checker
      definition: "the tool that explores a model: TLC or the P checker."
    - name: Pin
      definition: "a tool's version and settings, committed in the repository: a linter's ruleset, or a model's configuration."
    - name: Component
      definition: a part of a consumer's system with its own paths.
    - name: Component declaration record
      definition: each component's paths, whether it is a hard core, and its oracle designation.
    - name: Oracle designation
      definition: "how a component's generated inputs are judged: differential, fuzz, property-only, concurrency, soak, or none with a reason."
    - name: Review
      definition: a person's pass over G1.3's 11 items against a feature document at one revision, signed with the seat and revision.
    - name: Venue
      definition: where and when a gate runs.
    - name: Ready check
      definition: one of the 14 questions a feature document answers before intake reads it ready (ADRs 0029 and 0033).
    - name: Two-Key
      definition: the independent verifier's grade of one unit, PASS or FAIL.
