term: consult-case

name: Consult case

definition: >-
  One of the four conditions under which the engineer seat asks another
  engineer before the PR: an ambiguity in the requirements, more than one
  solution, a solution unconventional to the codebase, or a change to a
  public contract. The checks call them the four cases.

kind: entity

status: ratified
since: 2026-10-06

