# SDLC kit - per-repo configuration (written by /sdlc init, 2026-07-28).
kit: git+https://github.com/JJandDjango/sdlc-kit.git
adoption: brownfield  # greenfield | brownfield
stack: python  # free text; selects the tooling profile at activation
active_gates:
  - G0  # contract conformance - CI backstop; /sdlc intake is the venue
  - G1  # requirements and spec - /sdlc g1 is the venue; progress refuses a task until it passes
g1:
  exempt:
    - controlled-language
    - distribution-reconciliation
    - document-split
    - dotnet-profile-g0
    - dotnet-profile-g3
    - dotnet-profile-g4
    - feature-document
    - g0-declaration
    - g1-requirements-spec
    - intake-seats
    - operator-layer
    - pane-view
    - playbook-guardrails
    - project-tree
    - spec-interview
    - tree-first-level
    - tree-view
    - unit-dag
    - vocabulary-layer
  schemas:
    - paths: [taskcontract/schemas/*.json]
      linter: spectral
      pin: .spectral.yaml
# Gates join this list as the kit's activation program builds their
# enforcement: https://github.com/JJandDjango/sdlc-kit/blob/main/docs/gates.md
scope_check:
  # The seed list plus NOTES_*.md and the Cairn 2.0 pages (ARCHITECTURE.md,
  # CONTRIBUTING.md): the kit's working design notes precede any contract,
  # like REQUEST_*.md and decisions/. The 1.x pages stay listed because the
  # migration's commit deletes them, and a deleted path counts as touched. A
  # list here replaces the seed, so every default is repeated.
  free_paths:
    - THEORY.md
    - MAP.md
    - STATE.md
    - CONVENTIONS.md
    - DOCS-SYSTEM.md
    - ARCHITECTURE.md
    - CONTRIBUTING.md
    - decisions/
    - docs/
    - plan.md
    - plan.workflow.json
    - CHANGELOG.md
    - README.md
    - REQUEST_*.md
    - NOTES_*.md
    - .sdlc/
tree:
  # The herdr hook (E:/herdr-sdlc): flags the pane's seat in herdr's sidebar.
  notify: python E:/herdr-sdlc/herdr_seat.py
# The execution team's declaration (execution-team design): the test command and the wall's paths.
test:
  command: [python, -P, -m, pytest, tests, -q, -n, auto]
  file: [python, -P, -m, pytest, "{file}", -q]
wall:
  functional: [tests/]
