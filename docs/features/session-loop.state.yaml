schema: spec-interview-state/2
id: session-loop
started: 2026-11-21
phase: request
next: P6
origin: feature
title: Sessions restart themselves until you are needed
seats: {po: Johnathan Hyden}
answers:
  materials:
    - "plan.md section 2 (session 163's talk on the three stop cases and the herdr launcher)"
  statement: "As the developer running kit sessions, I want a wrapped session to start the next one itself, so that work goes on without my hand-run `/clear` and `/resume-session` until a decision needs me."
  description:
    - "At a natural stop, the wrap records Next and the position, commits, pushes, and writes a sentinel file last."
    - "A launcher outside any session sees the sentinel and types `/clear` and `/resume-session` into the same herdr pane, so the next session starts where the last one stopped."
    - "The loop stops in three cases: human needed (the question goes to a `needs-ruling` issue at the stop; a reply continues the same session; after 55 minutes with no reply the session wraps itself); no progress (two sessions in a row end where they started); Next empty (the wrap files a \"Pick the next deliverable\" issue)."
  background: "Since 2026-11-14 a session wraps itself past about 20% context at a natural stop, but the user restarts it by hand with `/clear` and `/resume-session`, so work waits whenever the user is away. The idea came from two IndyDevDan videos (2026-11-02 and 2026-11-09) on \"tiny software factories\": agents that keep working with the user near the loop rather than in it. run-restart (0.22.0) restarts a stopped team run in a fresh session, but only on the user's answer."
  existing_behavior:
    - text: "The close rule: a session's closing message is its last and asks nothing. A stop that waits on the user's word ends on a question instead."
      source: "the user's standing rule (session 100; 2026-11-14), held in Claude's memory, not in the repo"
    - text: "`/cairn status` prints open issues labelled `needs-ruling` under \"Waiting on you\"."
      source: "`status.py:17`"
    - text: "run-restart's non-goal: a run never relaunches itself in a loop."
      source: "`docs/features/run-restart.md:56`"
    - text: "A session left overnight is never resumed; a new one starts from the handoff."
      source: "`docs/conventions/standing-practice.md:11`"
    - text: "The herdr hook flags the tree pane on the kit's notify command."
      source: "`E:\\herdr-sdlc\\herdr_seat.py`, run as a repo's `tree: notify:` (`E:\\herdr-sdlc\\README.md:4-7`)"
  success_criteria:
    - {id: SC1, text: "After a wrap with a ready Next, the next session starts in the same pane with no keystroke from the user."}
    - {id: SC2, text: "A stop for the user's answer files its `needs-ruling` issue at the stop, and a reply within 55 minutes continues the same session."}
    - {id: SC3, text: "With no reply in 55 minutes, the session wraps itself."}
    - {id: SC4, text: "Two sessions in a row that end where they started, or a crashed session, stop the loop with an issue."}
    - {id: SC5, text: "An empty Next stops the loop with one issue."}
  split:
    second_document: session-loop-sidebar
    criteria:
      - "The herdr sidebar shows each loop's position, strike count and waiting state."
    moved_with_it:
      - "Description: the herdr sidebar line."
    reason: "Display work in `E:\\herdr-sdlc`; the kit takes no herdr dependency; SC1 to SC5 stand without it."
  non_goals:
    - "No new authorizations are added."
    - "The loop never picks a deliverable itself; a new feature still starts with the user's interview."
    - "No resume of an old session: every restart is a fresh session."
    - "No new window or tab per session."
    - "No built-in compaction as the restart."
    - "The kit has no dependency on herdr."
    - "No time or token budget per session."
  prerequisites:
    - {item: "herdr 0.9.1, whose `herdr pane send-text` and `herdr pane send-keys` drive a pane's input.", exists: true}
    - {item: "`gh` installed and signed in with `repo` scope, for the `needs-ruling` issues.", exists: true}
    - {item: "The `needs-ruling` label in the repo. Missing; owner: the user, who runs `gh label create needs-ruling` once before the first loop.", exists: false, owner: the user}
  checks:
    - {id: SC1.1, text: "verify that within 60 seconds of the wrap's sentinel appearing, the launcher types `/clear` and then `/resume-session` into the same pane.", regression_for: 4}
    - {id: SC1.2, text: "verify that the sentinel appears only after the wrap's commit is on the remote branch."}
    - {id: SC1.3, text: "verify that the new session's ready-state names the same Next the wrap recorded."}
    - {id: SC1.4, text: "verify that when a team run stops with no wrap, the launcher types nothing.", regression_for: 3}
    - {id: SC1.5, text: "verify that the kit's `tree: notify:` command still flags the tree pane while a loop runs.", regression_for: 5}
    - {id: SC2.1, text: "verify that at a stop for the user's answer, an open `needs-ruling` issue holds the question before the session waits."}
    - {id: SC2.2, text: "verify that a reply in the session 54 minutes after the stop continues that session, with no wrap and no sentinel."}
    - {id: SC2.3, text: "verify that on the reply, the session closes its `needs-ruling` issue."}
    - {id: SC2.4, text: "verify that a human-needed stop's last message ends on its question, and a wrap's closing message asks nothing.", regression_for: 1}
    - {id: SC3.1, text: "verify that with no reply, the session starts its wrap 55 minutes after the stop, give or take one minute."}
    - {id: SC3.2, text: "verify that after this self-wrap the launcher types nothing into the pane, and the `needs-ruling` issue stays open."}
    - {id: SC3.3, text: "verify that in the session the user starts next, `/cairn status` lists that issue under \"Waiting on you\".", regression_for: 2}
    - {id: SC4.1, text: "verify that when a second session in a row ends at the position it started from, the launcher types nothing and files one issue naming that position."}
    - {id: SC4.2, text: "verify that a session that moves the position resets the strike count to zero."}
    - {id: SC4.3, text: "verify that when the Claude process in the pane exits with no sentinel, or the pane shows no change for 60 minutes with no sentinel, the launcher types nothing and files one issue naming the pane and the last position."}
    - {id: SC5.1, text: "verify that when `/cairn status` prints Next as \"(none)\", the wrap files one \"Pick the next deliverable\" issue labelled `needs-ruling`, and the launcher types nothing."}
    - {id: SC5.2, text: "verify that when a \"Pick the next deliverable\" issue is already open, the wrap files no second one."}
    - {id: SC5.3, text: "verify that when Next is empty, the wrap's commit leaves it empty."}
  error_messages:
    - {check: SC2.1, text: "session-loop: the needs-ruling label is missing; run: gh label create needs-ruling"}
    - {check: SC4.1, text: "session-loop stopped: two sessions in a row ended at {position}"}
    - {check: SC4.3, text: "session-loop stopped: the session in pane {pane} exited without a wrap; last position {position}"}
    - {check: SC4.3, text: "session-loop stopped: the session in pane {pane} showed no change for 60 minutes; last position {position}"}
    - {check: SC5.1, text: "Pick the next deliverable"}
  decisions:
    - "Decided (session 163): the 55-minute timer, which sits inside the one-hour prompt cache."
    - "Decided (session 163): progress is the wrap's recorded position, and two strikes stop the loop."
    - "Decided (session 163): the launcher checks progress, not the session, so a crashed or hung session is caught."
    - "Decided (session 163): the launcher runs on herdr from the start."
    - "Decided (session 163): ADR 0031's split: the kit writes files (sentinel, position, stop issue); the herdr side in `E:\\herdr-sdlc` reads them."
    - "Decided (session 164): the herdr sidebar (each loop's position, strike count and waiting state) is a second feature, `session-loop-sidebar`."
    - "Decided (session 164): the reply comes in the session (the pane or a remote client); the `needs-ruling` issue is the notice and the record, never the reply channel."
    - "Decided (session 164): after a self-wrap at 55 minutes the loop stays stopped until the user restarts it."
    - "OPEN: can a timer (`CronCreate`) wake an idle interactive session?"
    - "OPEN: can `herdr pane send-keys` type slash commands into a Claude pane?"
    - "OPEN: how does the 55-minute notice reach the user: phone, email or desktop toast?"
  notes:
    - "From the Q11 regression mappings through Q15, the answers are Claude's recommendations, taken on the PO seat's word of 2026-11-22: \"Go with all of your recommendations for the remainder of these questions.\""
  terms:
    - {name: wrap, definition: "A session's close: record Next and the position, commit, push, then write the sentinel."}
    - {name: launcher, definition: "The process outside any session that, after a wrap, starts the next session in the same herdr pane and checks progress."}
    - {name: sentinel, definition: "The file the wrap writes last; it tells the launcher the wrap finished."}
    - {name: position, definition: "Where a wrap stopped: the plan step and the unit task."}
    - {name: strike, definition: "A session that ends at the position it started from; two strikes in a row stop the loop."}
    - {name: needs-ruling, definition: "The GitHub issue label `/cairn status` prints under \"Waiting on you\"."}
    - {name: session loop, definition: "The chain of sessions in one herdr pane, each started by the launcher after the last one's wrap."}
    - {name: human-needed stop, definition: "A stop where the session needs the user's answer: it files a `needs-ruling` issue and waits."}
    - {name: self-wrap, definition: "The wrap a session runs on its own 55 minutes after a human-needed stop with no reply; the loop stays stopped after it."}
    - {name: hung, definition: "A session whose pane shows no change for 60 minutes with no sentinel; the launcher treats it as crashed."}
  gherkin:
    - {check: SC1.1, name: "The launcher restarts the session in the same pane", given: "a session in a herdr pane whose wrap writes its sentinel", when: "60 seconds pass after the sentinel appears", then: "the launcher has typed `/clear` and then `/resume-session` into the same pane", status: accepted}
    - {check: SC1.2, name: "The sentinel follows the push", given: "a session running its wrap", when: "the sentinel appears", then: "the wrap's commit is already on the remote branch", status: accepted}
    - {check: SC1.3, name: "The new session names the recorded Next", given: "a wrap that recorded Next", when: "the launcher starts the new session", then: "the new session's ready-state names the same Next", status: accepted}
    - {check: SC1.4, name: "A stopped team run is not relaunched", given: "a team run in a pane", when: "the run stops with no wrap", then: "the launcher types nothing into the pane", status: accepted}
    - {check: SC1.5, name: "The notify hook still flags the tree pane", given: "a loop running in a herdr pane", when: "the kit runs its `tree: notify:` command", then: "the tree pane is flagged", status: accepted}
    - {check: SC2.1, name: "The stop files its question first", given: "a session that needs the user's answer", when: "it stops", then: "an open `needs-ruling` issue holds the question before the session waits", status: accepted}
    - {check: SC2.2, name: "A reply inside 55 minutes continues the session", given: "a session waiting at a human-needed stop", when: "the user replies in the session 54 minutes after the stop", then: "the same session continues, with no wrap and no sentinel", status: accepted}
    - {check: SC2.3, name: "The reply closes the issue", given: "a session waiting at a stop with an open `needs-ruling` issue", when: "the user replies in the session", then: "the session closes that issue", status: accepted}
    - {check: SC2.4, name: "A stop ends on its question and a wrap asks nothing", given: "a session in a loop", when: "it reaches a human-needed stop, or it wraps", then: "the stop's last message ends on its question, and the wrap's closing message asks nothing", status: accepted}
    - {check: SC3.1, name: "No reply in 55 minutes starts the wrap", given: "a session waiting at a human-needed stop", when: "no reply comes", then: "the session starts its wrap between 54 and 56 minutes after the stop", status: accepted}
    - {check: SC3.2, name: "After a self-wrap the loop stays stopped", given: "a session that wrapped itself 55 minutes after a stop", when: "the wrap's sentinel appears", then: "the launcher types nothing into the pane, and the `needs-ruling` issue stays open", status: accepted}
    - {check: SC3.3, name: "The open question waits for the user", given: "a self-wrap that left its `needs-ruling` issue open", when: "the user starts the next session and runs `/cairn status`", then: "\"Waiting on you\" lists that issue", status: accepted}
    - {check: SC4.1, name: "Two strikes stop the loop", given: "a session that ended at the position it started from", when: "the next session also ends at the position it started from", then: "the launcher types nothing, and files one issue naming that position", status: accepted}
    - {check: SC4.2, name: "Progress resets the strikes", given: "a loop with one strike", when: "a session ends at a position other than the one it started from", then: "the strike count is zero", status: accepted}
    - {check: SC4.3, name: "A crashed or hung session stops the loop", given: "a session in a loop", when: "its Claude process exits with no sentinel, or its pane shows no change for 60 minutes with no sentinel", then: "the launcher types nothing, and files one issue naming the pane and the last position", status: accepted}
    - {check: SC5.1, name: "An empty Next files one pick issue", given: "`/cairn status` prints Next as \"(none)\"", when: "the session wraps", then: "the wrap files one \"Pick the next deliverable\" issue labelled `needs-ruling`, and the launcher types nothing", status: accepted}
    - {check: SC5.2, name: "No second pick issue", given: "an open \"Pick the next deliverable\" issue", when: "a session wraps", then: "the wrap files no second one", status: accepted}
    - {check: SC5.3, name: "The loop never picks a deliverable", given: "Next is empty", when: "the session wraps", then: "the wrap's commit leaves Next empty", status: accepted}
open:
  - "Can a timer (`CronCreate`) wake an idle interactive session?"
  - "Can `herdr pane send-keys` type slash commands into a Claude pane?"
  - "How does the 55-minute notice reach the user: phone, email or desktop toast?"
  - "OPEN: Ready check 3: SC1 holds five checks and SC2 four, past the two or three a criterion takes; the extras are Q11's regression checks."
