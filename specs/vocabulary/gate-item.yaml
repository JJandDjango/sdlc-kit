term: gate-item

name: Gate item

definition: >-
  A gate's item at the first level, `gates/<gate>`, holding its
  conditions and the findings that name it. A verdict is one feature's
  result at a gate; a gate item reads all of them.

kind: entity

status: ratified
since: 2026-09-28

