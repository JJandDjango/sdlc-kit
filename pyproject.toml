[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-taskcontract"
version = "0.2.0"
description = "Task-contract validator + scaffold - the G0.1 definition-of-ready check (SDLC kit)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/JJandDjango/sdlc-kit"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["taskcontract"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
