[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-taskcontract"
version = "0.15.0"
description = "Task-contract validator + scaffold + vocabulary door - the G0 checks (SDLC kit)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/JJandDjango/sdlc-kit"

[project.optional-dependencies]
pane = ["textual>=8.2,<9"]
test = ["pytest>=8", "textual>=8.2,<9"]

[tool.setuptools]
packages = ["taskcontract"]

[tool.setuptools.package-data]
taskcontract = ["schemas/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
