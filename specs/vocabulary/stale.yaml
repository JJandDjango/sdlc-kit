# Glossary term - vocabulary layer (ADR 0017 V1).
# Born draft at project-tree's intake (session 51) from the Terms of
# docs/features/project-tree.md, decided at its Q11 (2026-09-24);
# ratified by the user 2026-09-25 (class-S flip; the PR merge is the
# outer record, ADR 0025).

term: stale

name: Stale

definition: >-
  A feature whose document holds a revision newer than the one its
  contract was derived from, or a derived block whose stamp is older than
  its document's newest revision, or a design document that names a
  requirements revision older than the requirements document's newest
  text revision. A "Ready:", "Measured:", "Signed:" or "Parked:" row
  never counts.

kind: attribute

status: ratified
since: 2026-09-25

