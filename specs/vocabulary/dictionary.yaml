# Controlled-language dictionary - the closed general-word class (F1).
# Ratified design: docs/controlled-language.md; schema
# taskcontract/schemas/dictionary.schema.json. Set-ratified: the PR
# merge is the ratification (vocab v1 pattern); later deltas ride the
# 0014 lanes - adding a word loosens the gate (full human lane),
# banning or removing tightens (auto lane).
#
# Seed provenance (F12): harvested 2026-08-02 by lang-extract's own
# tokenizer from the seven ready-green contracts - the corpus the kit
# already ratified. Full-corpus closure; the set closes at this merge.
# Census at seed: zero banned hits across all contracts, so the seed
# carries no repo bans - collapse deltas ride trace evidence (F8).
# pos policy v1: curated verb set (verb-first rule substrate), the
# remainder defaults to noun; refinement rides the same evidence lane.

