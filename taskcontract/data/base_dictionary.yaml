# Base dictionary - the wheel-shipped layer (F7, docs/controlled-language.md).
# Function words + bans + nothing else in v1: content verbs promote from
# consumer evidence only (accretion doctrine - nothing enters core
# speculatively). Never copied per repo (the agents/ anti-fork rule); the
# door unions base + repo dictionary + glossary, local glossary shadowing
# base (CL013, info). Ban use_instead here is a suggestion - integrity
# checks (CL004/CL005) bind the repo artifact only, so a base bump can
# never brick a consumer. Updates ride the pin bump with CHANGELOG notes.

