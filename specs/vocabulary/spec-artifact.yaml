term: spec-artifact
name: Spec artifact
definition: Any immutable artifact under the protected specs/ root - contracts, criteria, baselines, vocabulary - that encodes intent before implementation and may not be weakened by the implementer of the work it governs.
kind: entity
status: ratified
since: 2026-07-28
