term: tooling-profile

name: Tooling profile

definition: The kit's per-stack binding layer - a template overlay under skills/sdlc/templates/profiles/{stack}/ that init resolves on top of the stack-neutral base payload, selected by the consumer's declared stack; it binds gate shapes to ecosystem tooling without changing them (the 0008 two-layer model applied at the distribution layer). An absent or empty overlay renders the base exactly.

