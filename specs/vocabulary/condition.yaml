# Glossary term - vocabulary layer (ADR 0017 V1).
# Born draft at project-tree's intake (session 51) from the Terms of
# docs/features/project-tree.md, decided at its Q11 (2026-09-24);
# ratified by the user 2026-09-25 (class-S flip; the PR merge is the
# outer record, ADR 0025).

term: condition

name: Condition

definition: >-
  One named part of a gate, whose status comes from the rules it owns
  and, where they read records, from whether everything it needs is
  present and current (G0.1 definition of ready, G0.2 vocabulary
  coverage, G0.3 unit confirmation, G1.2 model checking).

kind: entity

status: ratified
since: 2026-09-25

