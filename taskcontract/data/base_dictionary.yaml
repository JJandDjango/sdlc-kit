banned:
  # evasive verbs - name the check or the observable outcome
  - word: ensure
    use_instead: [verify]
    reason: state the check, not the hope
  - word: ensures
    use_instead: [verify]
    reason: state the check, not the hope
  - word: ensured
    use_instead: [verify]
    reason: state the check, not the hope
  - word: ensuring
    use_instead: [verify]
    reason: state the check, not the hope
  - word: handle
    use_instead: [accept, reject, report]
    reason: evasive - name the observable outcome
  - word: handles
    use_instead: [accept, reject, report]
    reason: evasive - name the observable outcome
  - word: handled
    use_instead: [accept, reject, report]
    reason: evasive - name the observable outcome
  - word: handling
    use_instead: [accept, reject, report]
    reason: evasive - name the observable outcome
  # vague adverbs - state the measurable bound
  - {word: properly, reason: vague - state the measurable bound}
  - {word: appropriately, reason: vague - state the measurable bound}
  - {word: correctly, reason: vague - state the measurable bound}
  - {word: adequately, reason: vague - state the measurable bound}
  - {word: reasonably, reason: vague - state the measurable bound}
  - {word: robustly, reason: vague - state the measurable bound}
  - {word: seamlessly, reason: vague - state the measurable bound}
  - {word: efficiently, reason: vague - state the measurable bound}
  - {word: effectively, reason: vague - state the measurable bound}
  - {word: significantly, reason: vague - state the measurable bound}
  - {word: quickly, reason: vague - state the measurable bound}
  - {word: easily, reason: vague - state the measurable bound}
  - {word: simply, reason: vague - state the measurable bound}
  # vague adjectives - name the property and its bound
  - {word: appropriate, reason: vague - name the property and its bound}
  - {word: adequate, reason: vague - name the property and its bound}
  - {word: reasonable, reason: vague - name the property and its bound}
  - {word: robust, reason: vague - name the property and its bound}
  - {word: seamless, reason: vague - name the property and its bound}
  - {word: efficient, reason: vague - name the property and its bound}
  - {word: effective, reason: vague - name the property and its bound}
  - {word: significant, reason: vague - name the property and its bound}
  # vague quantifiers - give the count or the set
  - {word: several, reason: vague - give the count or the set}
  - {word: various, reason: vague - give the count or the set}
  - {word: numerous, reason: vague - give the count or the set}
  - {word: very, reason: intensifier - state the bound instead}
  - {word: etc, reason: open-ended - enumerate or bound the set}
