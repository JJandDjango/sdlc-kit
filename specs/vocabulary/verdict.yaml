term: verdict

name: Verdict

definition: The machine-actionable result a pipeline-native check emits - exit 0 green, 1 red with findings, 2 not applicable or unusable invocation - with findings as a JSON array of stable coded records an agent can loop against. The loop protocol consumes verdicts, never prose; codes stay stable so a break announces itself by name.

kind: entity

status: ratified
since: 2026-07-31

