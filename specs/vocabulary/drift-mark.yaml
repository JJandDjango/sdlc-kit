term: drift-mark

name: Drift mark

definition: >-
  The mark a feature with a contract carries from its document's
  revision table: `no feature document`, `no "Ready:" row` or `stale:
  document rD, contract from rM`. A pair's design document adds its own
  after it: `stale: design rD, contract from rM`.

kind: entity

status: ratified
since: 2026-09-28

