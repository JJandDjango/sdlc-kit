# Task contract - G0 definition-of-ready (ADR 0005 fields, ADR 0006 encoding).
# Contracts are immutable to implementers once ready (write-surface rule, ADR 0010).

id: session-loop

title: Sessions restart themselves until you are needed

intent: >-
  Today a session wraps itself at a natural stop, but the user starts the
  next one by hand with `/clear` and `/resume-session`, so work waits while
  the user is away. After this task a wrap writes a sentinel last, after
  its push, and a launcher outside any session types `/clear` and
  `/resume-session` into the same herdr pane within 60 seconds. The loop
  stops in three cases. At a human-needed stop the session files a
  `needs-ruling` issue and waits: a reply in the session continues it, and
  with no reply in 55 minutes the session wraps itself and the loop stays
  stopped. Two sessions in a row that end where they started, or a crashed
  or hung session, stop the loop with one issue. An empty Next files one
  "Pick the next deliverable" issue.

scope:
  - workflows/tools/loop.py
  - skills/sdlc/flows/loop.md
  - skills/sdlc/SKILL.md
  - hooks/loop_on.py
  - hooks/hooks.json
  - E:/herdr-sdlc/herdr_loop.py
  - E:/herdr-sdlc/tests/
  - E:/herdr-sdlc/README.md
  - tests/
  - docs/usage/
  - USAGE.md
  - docs/components.md
  - CHANGELOG.md
  - pyproject.toml
  - skills/sdlc/init.py
  - .github/workflows/sdlc.yml

non_goals:
  - No new authorizations are added.
  - The loop never picks a deliverable itself; a new feature still starts
    with the user's interview.
  - "No resume of an old session: every restart is a fresh session."
  - No new window or tab per session.
  - No built-in compaction as the restart.
  - The kit has no dependency on herdr.
  - No time or token budget per session.

decomposition:
  - unit: l1-loop-files
    id: l1-loop-files
    confirmed_by: [user]
    done_means: >-
      `loop.py stop` files the `needs-ruling` issue and writes the waiting
      file. `reply` closes that issue. `wrap` writes the sentinel last,
      after the push. With Next empty, `wrap` files one pick issue.
    acceptance_sketch:
      - >-
        verify that the sentinel appears only after the wrap's commit is on
        the remote branch (SC1.2)
      - >-
        verify that at a stop for the user's answer, an open `needs-ruling`
        issue holds the question before the session waits, and that on the
        reply the session closes that issue (SC2.1)
      - >-
        verify that when `/cairn status` prints Next as "(none)", the wrap
        files one "Pick the next deliverable" issue labelled
        `needs-ruling`, none when one is already open, and the launcher
        types nothing. Verify that when Next is empty, the wrap's commit
        leaves it empty (SC5.1, SC5.2)
  - unit: l2-loop-launcher
    id: l2-loop-launcher
    depends_on: [l1-loop-files]
    confirmed_by: [user]
    done_means: >-
      `herdr_loop.py` restarts the pane within 60 seconds of a `continue`
      sentinel. The launcher types nothing on any other sentinel or with
      none.
    acceptance_sketch:
      - >-
        verify that within 60 seconds of the wrap's sentinel appearing, the
        launcher types `/clear` and then `/resume-session` into the same
        pane, and the new session's ready-state names the Next the wrap
        recorded (SC1.1)
      - >-
        verify that while a loop runs, a team run that stops with no wrap
        gets no keystroke from the launcher, and the kit's `tree: notify:`
        command still flags the tree pane (SC1.3)
      - >-
        verify that after this self-wrap the launcher types nothing into
        the pane, and the `needs-ruling` issue stays open (SC3.2)
  - unit: l3-loop-stops
    id: l3-loop-stops
    depends_on: [l2-loop-launcher]
    confirmed_by: [user]
    done_means: >-
      Two strikes, an exit or a 60-minute hang stop the loop with one
      issue, and the launcher types nothing.
    acceptance_sketch:
      - >-
        verify that when a second session in a row ends at the position it
        started from, the launcher types nothing and files one issue naming
        that position (SC4.1)
      - >-
        verify that a session that moves the position resets the strike
        count to zero (SC4.2)
      - >-
        verify that when the Claude process in the pane exits with no
        sentinel, or the pane shows no change for 60 minutes with no
        sentinel, the launcher types nothing and files one issue naming the
        pane and the last position (SC4.3)
  - unit: l4-loop-rules
    id: l4-loop-rules
    depends_on: [l3-loop-stops]
    confirmed_by: [user]
    done_means: >-
      `/sdlc loop on` turns the loop on. In a loop, a session files its
      stop and sets its timer. A reply continues the session. With no
      reply, the session wraps itself. Kit 0.23.0 ships.
    acceptance_sketch:
      - >-
        verify that a reply in the session 54 minutes after the stop
        continues that session, with no wrap and no sentinel (SC2.2)
      - >-
        verify that a human-needed stop's last message ends on its
        question, and a wrap's closing message asks nothing (SC2.3)
      - >-
        verify that with no reply, the session starts its wrap 55 minutes
        after the stop, give or take one minute. Verify that in the session
        the user starts next, `/cairn status` lists that issue under
        "Waiting on you" (SC3.1, SC3.3)

