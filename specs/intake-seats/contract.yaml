# Task contract - G0 definition-of-ready (ADR 0005 fields, ADR 0006 encoding).
# Contracts are immutable to implementers once ready (write-surface rule, ADR 0010).

id: intake-seats

intent: >-
  Intake needs a human answer for every unit today, and no artifact
  holds the answer. The task records the answer in the contract. A seat
  list is a ratified term of kind `value-set`. Every unit names the
  seats under `confirmed_by`. The ready door rejects a unit with no
  seats and a seat the term lacks, when the term exists. The intake
  venue writes the answer of every unit, and `SKILL.md` passes
  `prompt_lang` with the step in it. `USAGE.md` gains a section on
  intake for a consumer with many seats.

scope:
  - taskcontract/
  - specs/
  - skills/sdlc/
  - docs/
  - decisions/
  - tests/
  - USAGE.md
  - CONVENTIONS.md
  - CHANGELOG.md

non_goals:
  - No G1 artifact. The G1 record and the G4.3 join are a separate
    task.
  - No check on the author of a field. The door reads the answer, never
    the author.
  - No change to `entities` or to the `dependencies` field.
  - No work in a consumer repo. The section names the consumer steps;
    the consumer runs them.

decomposition:
  - unit: adr-0025
    id: adr-0025
    confirmed_by: [user]
    done_means: The ADR records the rulings. A seat list is a ratified
      `value-set` term. `confirmed_by` names seats per unit. The door
      runs when the term exists. The pull merge stays the record. The G0
      roster grows to three conditions. The ADR names where the skill
      flows live.
    acceptance_sketch:
      - verify the ADR names the term ruling and the `confirmed_by`
        ruling
      - verify the ADR names the pull merge as the record
      - verify the ADR names where the skill flows live
  - unit: g0-usage-section
    id: g0-usage-section
    confirmed_by: [user]
    depends_on: [adr-0025]
    done_means: >-
      `USAGE.md` gains a section for intake with many seats. The section
      names the seats, the field each seat holds, the answer record, and
      the brownfield term flow. The section carries the `apply-discount`
      contract. The status marks read red at pass zero.
    acceptance_sketch:
      - verify the section names the seats and the field each seat holds
      - verify the section carries the `apply-discount` contract
  - unit: g0-skill-flows
    id: g0-skill-flows
    confirmed_by: [user]
    depends_on: [adr-0025]
    done_means: >-
      `skills/sdlc/SKILL.md` passes `prompt_lang` with the I5 step in
      it. The flows live where the ADR names. The existing intake rules
      read unchanged.
    acceptance_sketch:
      - run `prompt_lang` on the skill and verify exit zero
      - verify the existing intake rules read unchanged
  - unit: schema-1-3-0
    id: schema-1-3-0
    confirmed_by: [user]
    depends_on: [adr-0025]
    done_means: >-
      `$defs.unit` accepts an optional `confirmed_by` list of seat
      slugs. The schema version reads 1.3.0. Every 1.2.0 contract
      validates green.
    acceptance_sketch:
      - verify a unit carrying `confirmed_by` validates green
      - verify the schema version field reads 1.3.0
      - run validate over every contract and verify exit zero
  - unit: tc016-door
    id: tc016-door
    confirmed_by: [user]
    depends_on: [schema-1-3-0]
    done_means: With the seat term ratified, the ready profile emits
      TC016 for a unit with no `confirmed_by`. The profile emits TC016
      for a seat the term lacks. With no seat term, the door stays
      green. The draft profile never runs the rule.
    acceptance_sketch:
      - verify a unit with no `confirmed_by` yields TC016 naming the unit
      - verify a seat the term lacks yields TC016 naming the seat
      - verify a tree with no seat term validates green
  - unit: g0-seat-term
    id: g0-seat-term
    confirmed_by: [user]
    depends_on: [tc016-door]
    done_means: >-
      `specs/vocabulary/intake-seat.yaml` reads ratified with one entry.
      Every unit in every contract carries `confirmed_by`. The diff adds
      `confirmed_by` lines only.
    acceptance_sketch:
      - run validate over every contract at the ready profile and
        verify exit zero
      - verify the diff adds `confirmed_by` lines only
  - unit: g0-3-row
    id: g0-3-row
    confirmed_by: [user]
    depends_on: [adr-0025]
    done_means: The registry names G0.3. The deep page matches the row.
      The pull merge records the human answer for the class-E delta.
    acceptance_sketch:
      - verify the registry row and the deep page name G0.3
      - verify the pull merge records the human answer for the class-E
        delta
  - unit: g0-confirm-write
    id: g0-confirm-write
    confirmed_by: [user]
    depends_on: [g0-skill-flows, tc016-door]
    done_means: >-
      The intake venue renders the graph, needs a human answer for every
      unit, and writes `confirmed_by` before the contract lands. The
      `unit-dag` unit `g0-intake-review` closes on the same edit.
    acceptance_sketch:
      - verify the skill renders, needs an answer, writes `confirmed_by`,
        and only then writes the contract
      - verify the skill shows the findings of a red door after the
        write
  - unit: g0-docs-and-tests
    id: g0-docs-and-tests
    confirmed_by: [user]
    depends_on: [g0-usage-section, g0-seat-term, g0-3-row, g0-confirm-write]
    done_means: >-
      The task-contract page names `confirmed_by` and TC016.
      `CHANGELOG.md` carries the 1.3.0 note. `CONVENTIONS.md` gains one
      line. The `USAGE.md` section marks read green. The suite covers
      the door.
    acceptance_sketch:
      - verify the task-contract page names TC016
      - run pytest and verify exit zero with the door tests

dependencies: []

entities:
  - decomposition-unit
  - task-contract
  - gate
  - vocabulary-term
  - consumer

provenance:
  origin: human-request
