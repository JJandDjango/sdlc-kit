term: roll-up

name: Roll-up

definition: >-
  An item's status from the statuses of the items it counts: the first
  of failed, waiting on a seat, blocked and doing that any of them
  reads; else done when all read done; else doing when any reads done;
  else to do.

kind: entity

status: ratified
