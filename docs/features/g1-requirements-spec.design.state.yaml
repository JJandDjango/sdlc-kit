  sources:
  - fact: Whether G1 is active for a feature, and which features are already done
    read_from: '`.sdlc/config.yaml`: `G1` under `active_gates`, and the `g1.exempt` list'
    when_two_disagree: The exempt list wins for a feature it names, and it wins over a contract's close record, which is local and uncommitted.
  - fact: A feature's scope
    read_from: '`scope` in `specs/{id}/contract.yaml`'
    when_two_disagree: One source.
  - fact: Which files are boundary schemas, and each one's linter and pin
    read_from: the `g1.schemas` entries in `.sdlc/config.yaml`, matched against the files on disk
    when_two_disagree: The declared patterns win over what a file looks like; review item 10 is the guard.
  - fact: A lint result or a model-check result
    read_from: the last G1.1 or G1.2 record in `.sdlc/g1/{id}.yaml`
    when_two_disagree: 'The files on disk win: a record whose hashes no longer match counts as absent.'
  - fact: Whether a tool is installed
    read_from: the record, as `g1-record` found it on its run
    when_two_disagree: The record wins over the reader's PATH until the next run.
  - fact: The components, the hard cores, each model and each oracle designation
    read_from: '`specs/components.yaml`'
    when_two_disagree: The record wins for the rule. ADR 0007's criteria are how a person decides, and review item 11 is the guard.
  - fact: G1.3's 11 items, each a number and a name
    read_from: '`taskcontract/data/g1-items.yaml`'
    when_two_disagree: G1's page wins, and a test holds the list equal to the page's.
  - fact: 'A review: its signer, seat, revisions and each item''s answer'
    read_from: the last G1.3 record in `.sdlc/g1/{id}.yaml`
    when_two_disagree: One source.
  - fact: The revisions a contract was derived from
    read_from: the `Ready:` row of each document's revision table
    when_two_disagree: 'The tables win over the review record: a review that names other revisions does not count.'
  - fact: The seats a signer may name
    read_from: the ratified `intake-seat` term, `specs/vocabulary/intake-seat.yaml`
    when_two_disagree: One source.
  - fact: Whether G1 has passed, for the refusal, with the unit's and the feature's ids
    read_from: the feature's G1 verdict in the tree that `progress` builds on that call
    when_two_disagree: 'One source: the refusal and the tree give the same reading.'
  - fact: G0's verdict
    read_from: the validator at the draft and ready profiles, as today
    when_two_disagree: 'One source: no G1 rule reports there.'
  - fact: Which rule belongs to which condition
    read_from: '`rules:` in `taskcontract/data/gates.yaml`'
    when_two_disagree: One source.
  - fact: Where ready checks 1 to 15 are asked
    read_from: the interview's signing flow and intake's I2, as today
    when_two_disagree: 'One source: G1''s flow holds none of their question sentences.'
  - fact: The parts of intake's report
    read_from: I9 of `skills/sdlc/flows/intake.md`, as today, with the feature's id
    when_two_disagree: One source.
  constraints:
  - Every message the kit prints today stays word for word, and `validate` keeps every byte of its output.
  - 'No G1 rule reports through `checker.validate_path`: ready-green means G0 alone for the tree, the write guard, the audit, CI and pre-commit.'
  - The contract schema stays at version 1.5.0. A new schema is born at 1.0.0 with its own `$id`.
  - 'No new dependency: the package keeps `jsonschema` and `PyYAML`. The kit ships and installs no linter and no checker.'
  - The whole suite passes on a machine with no linter and no checker installed, through a stand-in tool or a written record.
  - '`g1-record` captures a tool''s output as UTF-8 with replacement, opens no window, and tells a tool that did not start from one that ran and failed. It sets no time limit.'
  - 'The tree stays derived at every print: G1''s reading stores nothing and runs no tool.'
  - '`.sdlc/progress/` holds no G1 record, and no gate reads a progress file (ADRs 0024 and 0031).'
  - An exempt feature's tree lines keep every byte, and the `gates/G0` line keeps its reading.
  - Each prompt file the build touches passes `python -m prompt_lang`, keeps the PromptLang tag set and stays under 12,000 characters. `intake.md` has 495 characters free.
  - Intake keeps I1 to I9 and their order, and I9's sentence names no fifth `python -m taskcontract` command.
  - The 13 question sentences of ready checks 1 to 8 and 11 to 15 stand in no G1 file.
  - 'G1.3''s 11 items stay as ratified, and no agent signs a review: the flow runs the writer only on the person''s word.'
  - 'Every authored command is one segment: no pipe, no chain, no redirect.'
  - In USAGE a red sentence stands under its own red subsection, and a new drawing in section 9 follows the pinned ones.
  units:
  - id: s1-lint
    checks: SC2.1, SC2.2, SC2.3
    done_means: With a boundary schema in a feature's scope, G1.1 reads done only when the pinned linter's record shows it clean.
    tests: 'SC2.1: automated, with a stand-in linter, and a manual receipt, a live Spectral run on one clean file and one unclean file. SC2.2: automated. SC2.3: automated.'
    retirements: USAGE's red-legend test, at pass zero (`tests/test_document_split_release.py:517-527`). The two tests that hold `rules:` to G0's conditions (`tests/test_tree_conditions.py:313-327` and `432-442`), each replaced by one that holds G1's too.
  - id: s2-model
    checks: SC3.1, SC3.2, SC3.3
    done_means: With a hard core in a feature's scope, G1.2 reads done only when the record shows its model passes the checker.
    tests: 'SC3.1: automated, with a stand-in checker, and a manual receipt, a live TLC run on one passing model and one failing model. SC3.2: automated. SC3.3: automated.'
    retirements: none
  - id: s3-review
    checks: SC1.1, SC1.2, SC1.3
    done_means: A seat reads G1.3's 11 items at the venue, and G1.3 reads done only from a review with a signature.
    tests: 'SC1.1: automated, and a manual receipt, a live run of `/sdlc g1` on an invented feature with a seat answering the 11 items. SC1.2: automated. SC1.3: automated, a text test on G1''s flow, the interview and intake.'
    retirements: none
  - id: s4-tree
    checks: SC5.1, SC5.2, SC5.3
    done_means: The tree shows G1 as an active gate where a feature needs it, with each condition's status, diagnostics and review.
    tests: 'SC5.1: automated. SC5.2: automated. SC5.3: automated.'
    retirements: The sha256 pin on `tree.py`'s code (`tests/test_document_split_release.py:483-490`); the docstring's sentence order, pinned at line 487, stays.
  - id: s5-start
    checks: SC4.1, SC4.2
    done_means: Intake's report names G1 as the next step, and no unit's task reads done before its feature's G1 passes.
    tests: 'SC4.1: automated, a text test on I9, and a manual receipt, a live intake run whose report ends on the G1 line. SC4.2: automated.'
    retirements: 'Two sentences that say no task is enforced, each reworded: `tasks.yaml`''s header comment and USAGE''s "shown and never enforced". No test pins either.'
  - id: s6-release
    checks: SC4.3
    done_means: Kit 0.20.0 ships G1 with its documentation, and the kit's own tree shows G1 as an active gate with G0 unchanged.
    tests: 'SC4.3: automated, on a fixture and on the kit''s own tree. Two manual receipts: the install from the tag reads 0.20.0, and Spectral lints the kit''s four schemas under `.spectral.yaml`.'
    retirements: Section 9's banner test (`tests/test_document_split_release.py:530-545`), replaced. USAGE's drawing of this feature before intake (`USAGE.md:1640-1655`), redrawn on an invented feature.
  order: |-
    The units are built in a line: `s1-lint`, `s2-model`, `s3-review`,
    `s4-tree`, `s5-start`, `s6-release`.

    - `s1-lint` is first. It opens with pass zero, USAGE's guide to G1 written under red marks, and it lays the base the rest stand on: `g1.py`, the record file, the declarations' readers and both commands.
    - `s2-model` adds the component declaration record and G1.2 on that base.
    - `s3-review` follows both, since its flow runs their two commands at R3 and R4.
    - `s4-tree` follows the three rules: the tree prints what they read.
    - `s5-start` follows the tree: the refusal reads the tree's G1 verdict.
    - `s6-release` is last. It turns the red marks green, moves the versions and turns G1 on at the kit.
  risks_and_cost: |-
    What can go wrong:

    1. Spectral may not lint a plain JSON Schema file without a ruleset the kit writes, and prerequisite 8 depends on it. `s1-lint`'s live run settles it before that unit's test list is approved.
    2. P gets no live run, and TLC's needs Java and `tla2tools.jar` on the build machine. A wrong reading of P's exit code would first show at a consumer.
    3. Nothing but the flow's rule stops an agent from running `g1-record review`. The non-goal "no agent attests G1.3" holds as a rule of the flow, since no code can tell a person from an agent.
    4. `s4-tree` changes `tree.py`, the kit's most pinned file: 20 tests pin its print or its code today, by the explorers' count. A fixture with G0 and G1 active and no declaration must keep reading `to do`.
    5. `intake.md` has 495 characters free, and I9's sentence takes about 150. A second edit to intake in this feature would crowd the cap.
    6. Four calls go past requirements r3: messages 6 and 7, I9's condition, the refusal on `done` and on a contract's close, and a review that names two revisions. The pair parks at intake until the PO seat's amendment carries them.
    7. The requirements document holds no Gherkin block, so intake parks the pair until the PO seat adds one scenario for each of the 15 checks.
    8. Turning G1 on at the kit refuses this feature's own last tasks unless its id joins the exempt list in the same commit.
    9. The tree reads the two declarations and one record file a feature at every print, and the pane keeps no G1 reading. `s4-tree` measures the print on the kit's 20 features.
    10. `{section}` in message 5 is text a person names, and nothing checks that the section exists.

    What it costs: six units over about six sessions, after two to three
    sessions for the PO seat's amendment and intake. The agents cost 3.7
    million tokens at document-split's recorded pace (3,648K over its six
    units, each passing Two-Key in round 1), 4 to 5 million likely, and
    about 300K more for each lost Two-Key round. The live runs need
    Spectral, and Java with `tla2tools.jar`, on the build machine.
