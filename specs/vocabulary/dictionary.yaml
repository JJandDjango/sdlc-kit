# Standing-red ratchet (posture ruling 3 + ADR 0015 pairing): the six
# pre-arc contracts, born before the door, take prose-rule findings at
# warning severity - visible, never gating. Ledger entry:
# .sdlc/reds.yaml cl-legacy-tranche. A contract leaves this list at its
# next edit (removal = tightening, auto lane); new contracts never enter.
exempt:
  - specs/distribution-reconciliation/contract.yaml
  - specs/dotnet-profile-g0/contract.yaml
  - specs/dotnet-profile-g3/contract.yaml
  - specs/dotnet-profile-g4/contract.yaml
  - specs/operator-layer/contract.yaml
  - specs/vocabulary-layer/contract.yaml
