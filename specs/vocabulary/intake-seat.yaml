term: intake-seat

name: Intake seat

definition: >-
  A human position that answers for a decomposition unit at intake. The
  closed set names the positions a consumer recognizes; a unit's
  `confirmed_by` names the positions that answered for it. A seat is
  never delegated to an agent.

kind: value-set

values:
  - user

aliases:
  - seat

status: ratified
since: 2026-08-25

